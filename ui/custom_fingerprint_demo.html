<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Fingerprint Demo</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #080d18; color: #e8ecf7; }
    body { margin: 0; padding: 2rem 1rem; }
    main { max-width: 680px; margin: auto; padding: 1.5rem; border: 1px solid #26334b; border-radius: 16px; background: #101827; }
    h1 { margin-top: 0; }
    .note { color: #bac6dc; }
    form { display: grid; gap: 1rem; margin-top: 1.5rem; }
    label { display: grid; gap: .35rem; }
    select, button { padding: .75rem; border-radius: 8px; border: 1px solid #41516e; background: #0a1220; color: inherit; font: inherit; }
    button { cursor: pointer; background: #164e63; }
    button:disabled { opacity: .6; cursor: wait; }
    #result { margin-top: 1.25rem; padding: 1rem; border-radius: 8px; background: #0a1220; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Custom Team Fingerprint Demo</h1>
    <p class="note">This demo uses only the custom fingerprint test images and the existing saved SVM/templates. Nour and Sama are assumed demo aliases for FVC2002 identities; they do not represent verified real-person matches.</p>
    <form id="verify-form">
      <label>Claimed custom identity
        <select id="claimed-alias" required></select>
      </label>
      <label>Test image identity
        <select id="probe-alias" required></select>
      </label>
      <label>Test fingerprint
        <select id="image-name" required></select>
      </label>
      <button id="verify-button" type="submit">Verify test image</button>
    </form>
    <div id="result" role="status" aria-live="polite">Loading custom demo mappings…</div>
  </main>
  <script src="custom_fingerprint_demo.js" defer></script>
</body>
</html>
